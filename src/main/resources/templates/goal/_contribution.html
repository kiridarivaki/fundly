<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contributionForm"
     id="contributionModal"
     class="modal-overlay"
     style="display: none;">

    <div class="modal-content">

        <div class="modal-header">
            <h3 class="modal-title">Contribute to <span th:text="${feedData.goalName}">Goal</span></h3>
            <button id="closeContributionModalBtn"
                    type="button"
                    class="close-btn">
                &times;
            </button>
        </div>

        <form th:action="@{/goal/{id}/contribute(id=${feedData.goalId})}"
              th:object="${contribution}"
              method="post"
              class="form-group">

            <div class="form-field">
                <label for="amount">Amount ($)</label>
                <input type="number"
                       step="0.01"
                       id="amount"
                       th:field="*{amount}"
                       placeholder="0.00"
                       class="form-input">
                <p th:if="${#fields.hasErrors('amount')}"
                   th:errors="*{amount}"
                   class="error-message"></p>
            </div>

            <div class="form-field">
                <label for="description">Description (Optional)</label>
                <textarea id="description"
                          th:field="*{description}"
                          rows="3"
                          placeholder="What is this contribution for?"
                          class="form-input"></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Log Contribution
            </button>
        </form>
    </div>
</div>
