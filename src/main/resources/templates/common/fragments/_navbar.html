<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Navbar</title>
</head>
<body>
<div th:fragment="navbar" class="navbar">
  <a th:href="@{/home}">Home</a>

  <div sec:authorize="isAnonymous()">
    <a th:href="@{/auth/login}">Login</a>
    <a th:href="@{/user/register}">Register</a>
  </div>

  <div sec:authorize="isAuthenticated()" class="right-items">
    <span>Welcome, <span sec:authentication="name"></span></span>

    <a th:href="@{/expense/expense-manager}">Expense Manager</a>

    <form th:action="@{/logout}" method="post" style="display:inline;">
      <button type="submit">Logout</button>
    </form>
  </div>
</div>
</body>
</html>
