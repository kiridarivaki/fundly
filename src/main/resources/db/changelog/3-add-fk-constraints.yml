databaseChangeLog:
  - changeSet:
      id: 8-add-fk-constraints
      author: fundly
      changes:
        - addForeignKeyConstraint:
            baseTableName: expense
            baseColumnNames: user_id
            constraintName: fk_expense_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: expense
            baseColumnNames: category_id
            constraintName: fk_expense_category
            referencedTableName: expense_category
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: savings_goal
            baseColumnNames: user_id
            constraintName: fk_savings_goal_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: loan
            baseColumnNames: user_id
            constraintName: fk_loan_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: loan_payment
            baseColumnNames: loan_id
            constraintName: fk_loan_payment_loan
            referencedTableName: loan
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: expense_category
            baseColumnNames: user_id
            constraintName: fk_expense_category_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: goal_event
            baseColumnNames: user_id
            constraintName: fk_goal_event_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: goal_event
            baseColumnNames: goal_id
            constraintName: fk_goal_event_goal
            referencedTableName: savings_goal
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: savings_goal_collaborator
            baseColumnNames: goal_id
            constraintName: fk_sgc_goal
            referencedTableName: savings_goal
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: savings_goal_collaborator
            baseColumnNames: user_id
            constraintName: fk_sgc_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE