databaseChangeLog:
  - changeSet:
      id: 1-create-user
      author: fundly
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: employment_status
                  type: VARCHAR(255)
              - column:
                  name: monthly_allowance
                  type: DOUBLE
              - column:
                  name: local_currency
                  type: VARCHAR(10)
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-expense-category
      author: fundly
      changes:
        - createTable:
            tableName: expense_category
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: icon_identifier
                  type: VARCHAR(255)
              - column:
                  name: budget_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            columnNames: user_id, name
            constraintName: ux_expense_category_user_id_name
            tableName: expense_category
  - changeSet:
      id: 3-create-expense
      author: fundly
      changes:
        - createTable:
            tableName: expense
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: amount
                  type: DOUBLE
              - column:
                  name: date
                  type: DATE
              - column:
                  name: frequency
                  type: VARCHAR(50)
              - column:
                  name: is_future_expense
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 4-create-savings-goal
      author: fundly
      changes:
        - createTable:
            tableName: savings_goal
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: priority
                  type: VARCHAR(50)
              - column:
                  name: target_amount
                  type: DOUBLE
              - column:
                  name: current_amount
                  type: DOUBLE
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: is_life_goal
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 5-create-loan
      author: fundly
      changes:
        - createTable:
            tableName: loan
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: current_balance
                  type: DOUBLE
              - column:
                  name: interest_rate
                  type: DOUBLE
              - column:
                  name: min_monthly_payment
                  type: DOUBLE
              - column:
                  name: payment_frequency
                  type: VARCHAR(50)
              - column:
                  name: start_date
                  type: DATE
              - column:
                  name: maturity_date
                  type: DATE
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 6-create-loan-payment
      author: fundly
      changes:
        - createTable:
            tableName: loan_payment
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: amount_paid
                  type: DOUBLE
              - column:
                  name: date_paid
                  type: DATE
              - column:
                  name: loan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
